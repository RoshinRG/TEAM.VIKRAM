<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/images/logo-light.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Student-led aerospace engineering — Rocketry, Drone Tech & CanSat">
    <title>Team Vikram</title>
    <style>
      .circular-icon {
        display: block;
        width: 28px;
        height: 28px;
        /* Change this to a dark color so your white logo is visible */
        background-color: #3c4043;
        border-radius: 50%;
        object-fit: contain; /* 'contain' is often better for logos to prevent cropping */
        padding: 4px; /* Optional: adds space between your logo and the circle edge */
      }
    </style>
  </head>
  <body>
    <div class="icon-container" aria-hidden="true">
      <img class="circular-icon" src="/images/logo-light.png" alt="Team Vikram Logo">
    </div>
    <div id="root"></div>
  </body>
</html>
